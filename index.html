<script>

/* =====================================================
   設定
===================================================== */

/*
 * GAS WebアプリURLをここに入れる
 *
 * 例：
 * const GAS_URL =
 *   "https://script.google.com/macros/s/AKfycbxoNoQf0sHjs3uhq56gYuxWmDvmdiheV3WI8j5BquSWUuNJI6U10Sql6oq2mvnkhcWLVA/exec";
 */
const GAS_URL = "";


/* =====================================================
   端末ID
===================================================== */

const DEVICE_KEY = "消防団お知らせ_device_id";

function getDeviceId(){

  let id = localStorage.getItem(DEVICE_KEY);

  if(!id){

    id =
      "D-" +
      Date.now().toString(36) +
      "-" +
      Math.random().toString(36).substring(2,10);

    localStorage.setItem(DEVICE_KEY,id);
  }

  return id;
}


/* =====================================================
   初期表示
===================================================== */

document.addEventListener("DOMContentLoaded",()=>{

  getDeviceId();

  if(localStorage.getItem("notice_device_registered") === "1"){
    showUserScreen();
    loadNotices();
  }else{
    showRegisterScreen();
  }

});


/* =====================================================
   画面切り替え
===================================================== */

function hideAll(){

  document.getElementById("userScreen").style.display="none";
  document.getElementById("registerScreen").style.display="none";
  document.getElementById("adminLoginScreen").style.display="none";
  document.getElementById("adminScreen").style.display="none";

}

function showUserScreen(){

  hideAll();

  document.getElementById("userScreen").style.display="block";

  loadNotices();

}

function showRegisterScreen(){

  hideAll();

  document.getElementById("registerScreen").style.display="block";

}

function showAdminLogin(){

  hideAll();

  document.getElementById("adminLoginScreen").style.display="block";

  document.getElementById("adminCode").value="";
  document.getElementById("adminError").textContent="";

}

function showAdminScreen(){

  hideAll();

  document.getElementById("adminScreen").style.display="block";

}


/* =====================================================
   初回端末登録
===================================================== */

async function registerDevice(){

  const code =
    document.getElementById("registerCode").value.trim();

  const error =
    document.getElementById("registerError");

  error.textContent="";

  if(!code){

    error.textContent="登録コードを入力してください。";
    return;

  }

  const button =
    document.querySelector("#registerScreen .primary-btn");

  button.disabled=true;
  button.textContent="登録中…";

  try{

    const result =
      await gasRequest({
        action:"registerDevice",
        code:code,
        deviceId:getDeviceId()
      });

    if(result && result.success){

      localStorage.setItem(
        "notice_device_registered",
        "1"
      );

      showToast("この端末を登録しました");

      showUserScreen();

    }else{

      error.textContent =
        result?.message ||
        "登録コードが正しくありません。";

    }

  }catch(e){

    console.error(e);

    error.textContent =
      "通信に失敗しました。時間をおいて再度お試しください。";

  }finally{

    button.disabled=false;
    button.textContent="この端末を登録";

  }

}


/* =====================================================
   お知らせ取得
===================================================== */

async function loadNotices(){

  const list =
    document.getElementById("noticeList");

  list.innerHTML=`
    <div class="loading">
      <div class="spinner"></div>
      読み込み中…
    </div>
  `;

  try{

    const result =
      await gasRequest({
        action:"getNotices",
        deviceId:getDeviceId()
      });

    if(!result || !result.success){

      throw new Error(
        result?.message || "取得失敗"
      );

    }

    const notices =
      Array.isArray(result.notices)
        ? result.notices
        : [];

    renderNotices(notices);

  }catch(e){

    console.error(e);

    list.innerHTML=`
      <div class="empty">
        お知らせを取得できませんでした。<br>
        <button
          onclick="loadNotices()"
          style="
            margin-top:14px;
            padding:9px 15px;
            border:1px solid #ccd3dd;
            background:#fff;
            border-radius:9px;
          ">
          再読み込み
        </button>
      </div>
    `;

  }

}


/* =====================================================
   お知らせ表示
===================================================== */

function renderNotices(notices){

  const list =
    document.getElementById("noticeList");

  if(!notices.length){

    list.innerHTML=`
      <div class="empty">
        現在、お知らせはありません。
      </div>
    `;

    return;
  }


  const today =
    startOfDay(new Date());


  const normalized =
    notices.map((notice,index)=>{

      const due =
        parseDate(
          notice.dueDate ||
          notice.期日 ||
          notice.deadline
        );

      const days =
        due
          ? diffDays(today,due)
          : null;

      /*
       * 3日前〜当日
       */
      const urgent =
        days !== null &&
        days >= 0 &&
        days <= 3;

      const expired =
        days !== null &&
        days < 0;

      return {
        ...notice,
        _index:index,
        _due:due,
        _days:days,
        _urgent:urgent,
        _expired:expired
      };

    });


  /*
   * 3日前〜当日は上位。
   * それ以外は元の登録順。
   */
  normalized.sort((a,b)=>{

    if(a._urgent && !b._urgent) return -1;
    if(!a._urgent && b._urgent) return 1;

    return a._index - b._index;

  });


  list.innerHTML =
    normalized
      .map(createNoticeCard)
      .join("");

}


/* =====================================================
   カード生成
===================================================== */

function createNoticeCard(notice){

  const title =
    escapeHtml(
      notice.title ||
      notice.タイトル ||
      "無題のお知らせ"
    );

  const body =
    escapeHtml(
      notice.body ||
      notice.本文 ||
      ""
    );

  const postDate =
    formatDate(
      parseDate(
        notice.postDate ||
        notice.掲載日
      )
    );

  const dueDate =
    formatDate(notice._due);


  let badges="";


  if(
    notice.important === true ||
    notice.important === "true" ||
    notice.重要 === true ||
    notice.重要 === "TRUE" ||
    notice.重要 === "○"
  ){

    badges +=
      `<span class="badge badge-important">重要</span>`;

  }


  if(notice._urgent){

    const text =
      notice._days === 0
        ? "本日期限"
        : `あと${notice._days}日`;

    badges +=
      `<span class="badge badge-urgent">${text}</span>`;

  }


  if(notice._expired){

    badges +=
      `<span class="badge badge-expired">期限終了</span>`;

  }


  let fileHtml="";

  const fileUrl =
    notice.fileUrl ||
    notice.fileURL ||
    notice.添付URL ||
    notice.url ||
    "";

  const fileName =
    escapeHtml(
      notice.fileName ||
      notice.file名 ||
      "添付ファイル"
    );


  if(fileUrl){

    fileHtml=`
      <div class="notice-file">
        <a
          class="file-link"
          href="${escapeAttr(fileUrl)}"
          target="_blank"
          rel="noopener">
          📎 ${fileName}
        </a>
      </div>
    `;

  }


  const period =
    postDate || dueDate
      ? `
        <div class="notice-period">
          ${postDate ? `掲載日：${postDate}` : ""}
          ${postDate && dueDate ? "　" : ""}
          ${dueDate ? `期日：${dueDate}` : ""}
        </div>
      `
      : "";


  return `
    <article
      class="
        notice-card
        ${notice._urgent ? "urgent" : ""}
        ${notice._expired ? "expired" : ""}
      ">

      <div class="notice-top">

        <div class="notice-date">
          ${postDate || ""}
        </div>

        <div class="notice-status">
          ${badges}
        </div>

      </div>

      <h2 class="notice-title">
        ${title}
      </h2>

      ${
        body
          ? `<div class="notice-body">${body}</div>`
          : ""
      }

      ${fileHtml}

      ${period}

    </article>
  `;

}


/* =====================================================
   管理者ログイン
===================================================== */

async function loginAdmin(){

  const code =
    document.getElementById("adminCode").value.trim();

  const error =
    document.getElementById("adminError");

  error.textContent="";

  if(!code){

    error.textContent="管理者コードを入力してください。";
    return;

  }


  try{

    const result =
      await gasRequest({
        action:"adminLogin",
        code:code,
        deviceId:getDeviceId()
      });


    if(result && result.success){

      sessionStorage.setItem(
        "notice_admin_session",
        result.session ||
        "1"
      );

      showAdminScreen();

    }else{

      error.textContent =
        result?.message ||
        "管理者コードが正しくありません。";

    }

  }catch(e){

    console.error(e);

    error.textContent =
      "通信に失敗しました。";

  }

}


/* =====================================================
   管理操作
===================================================== */

async function adminAction(action){

  /*
   * ここは管理画面機能を追加するための入口。
   * Code.gs側の管理APIと接続可能。
   */

  if(action === "reload"){

    showToast("更新しています…");

    await loadNotices();

    return;

  }


  if(action === "add"){

    showToast("お知らせ追加画面を開きます");

    /*
     * 今後ここに追加画面を接続
     */

    return;

  }


  if(action === "edit"){

    showToast("お知らせ編集画面を開きます");

    return;

  }


  if(action === "delete"){

    showToast("お知らせ削除画面を開きます");

    return;

  }


  if(action === "devices"){

    showToast("登録端末一覧を開きます");

    return;

  }


  if(action === "disable"){

    showToast("端末管理を開きます");

    return;

  }

}

async function gasRequest(data){

  if(!GAS_URL){

    /*
     * GAS URL未設定時
     */
    throw new Error(
      "GAS_URLが設定されていません"
    );

  }


  const response =
    await fetch(
      GAS_URL,
      {
        method:"POST",
        headers:{
          "Content-Type":
            "text/plain;charset=utf-8"
        },
        body:JSON.stringify(data)
      }
    );


  if(!response.ok){

    throw new Error(
      "HTTP " + response.status
    );

  }


  return await response.json();

}


/* =====================================================
   日付処理
===================================================== */

function parseDate(value){

  if(!value) return null;

  if(value instanceof Date){

    return startOfDay(value);

  }


  const str =
    String(value).trim();

  if(!str) return null;


  const normalized =
    str
      .replace(/\//g,"-")
      .replace(/\./g,"-");


  const date =
    new Date(normalized);


  if(isNaN(date.getTime())){

    return null;

  }


  return startOfDay(date);

}


function startOfDay(date){

  const d =
    new Date(date);

  d.setHours(0,0,0,0);

  return d;

}


function diffDays(from,to){

  const ms =
    to.getTime() -
    from.getTime();

  return Math.round(
    ms / 86400000
  );

}


function formatDate(date){

  if(!date) return "";

  return (
    date.getFullYear() +
    "/" +
    String(
      date.getMonth()+1
    ).padStart(2,"0") +
    "/" +
    String(
      date.getDate()
    ).padStart(2,"0")
  );

}


/* =====================================================
   HTMLエスケープ
===================================================== */

function escapeHtml(value){

  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


function escapeAttr(value){

  return escapeHtml(value);

}


/* =====================================================
   TOAST
===================================================== */

let toastTimer=null;

function showToast(message){

  const toast =
    document.getElementById("toast");

  toast.textContent=message;

  toast.classList.add("show");

  clearTimeout(toastTimer);

  toastTimer =
    setTimeout(()=>{
      toast.classList.remove("show");
    },2200);

}
