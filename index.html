<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#172033">
<title>Board</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP","Yu Gothic",sans-serif;color:#18202d;background:#dfe4ea}
body{min-height:100vh}button,input,textarea{font:inherit}button{cursor:pointer}
.header{position:sticky;top:0;z-index:20;background:#172033;color:#fff;box-shadow:0 2px 10px rgba(0,0,0,.18)}
.header-inner{max-width:760px;margin:auto;min-height:62px;padding:9px 14px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.logo{font-size:20px;font-weight:800}.header-actions{display:flex;gap:7px}
.header-btn,.back-btn{border:1px solid rgba(255,255,255,.24);background:rgba(255,255,255,.09);color:#fff;border-radius:9px;padding:8px 11px;font-size:13px}
.main,.admin-main{max-width:760px;margin:auto;padding:17px 13px 40px}
.page-title{font-size:24px;font-weight:800;margin:3px 2px 5px}
.user-title-row{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:17px}
.user-title-row .page-title{margin:3px 2px 0}
.admin-entry{border:1px solid #c5ccd6;background:#fff;color:#4b5666;border-radius:9px;padding:7px 11px;font-size:12px;font-weight:700;box-shadow:0 2px 6px rgba(20,30,45,.06)}
.admin-entry:active{transform:scale(.97)}
.page-subtitle{display:none}
.notice-list{display:flex;flex-direction:column;gap:12px}
.notice-card{background:#fff;border:1px solid #d9dfe7;border-radius:16px;padding:15px;box-shadow:0 3px 10px rgba(20,30,45,.07)}
.notice-card{overflow:hidden}
.notice-summary-btn{display:block;width:100%;border:0;background:transparent;padding:0;text-align:left;cursor:pointer;color:inherit}
.notice-card:active{transform:scale(.995)}
.notice-summary{display:flex;align-items:center;gap:10px}
.notice-summary-main{min-width:0;flex:1}
.notice-chevron{flex:0 0 auto;width:30px;height:30px;border-radius:50%;background:#f0f2f5;display:flex;align-items:center;justify-content:center;color:#596577;font-size:16px;transition:transform .2s,background .2s}
.notice-card.open .notice-chevron{transform:rotate(180deg);background:#e5e9ee}
.notice-details{display:none;margin-top:12px;padding-top:12px;border-top:1px solid #e2e6eb}
.notice-card.open .notice-details{display:block}


.notice-card.urgent{background:#fff8df;border:2px solid #efc94d;box-shadow:0 4px 14px rgba(210,165,35,.14)}
.notice-card.expired{opacity:.68}
.notice-top{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;margin-bottom:6px}
.notice-date{font-size:12px;color:#667085;font-weight:600}.notice-status{display:flex;gap:5px;flex-wrap:wrap;justify-content:flex-end}
.badge{display:inline-flex;align-items:center;min-height:23px;padding:3px 8px;border-radius:999px;font-size:11px;font-weight:800;white-space:nowrap}
.badge-important{color:#fff;background:#dc3545}.badge-urgent{color:#634c00;background:#ffd86b}.badge-expired{color:#fff;background:#8b95a5}
.notice-title{font-size:19px;line-height:1.4;font-weight:800;margin:0 0 9px;color:#172033}
.notice-body{font-size:14px;line-height:1.8;white-space:pre-wrap;word-break:break-word}
.notice-period{margin-top:12px;padding-top:10px;border-top:1px solid #e6e9ee;color:#687385;font-size:12px}
.file-link{display:flex;align-items:center;gap:8px;text-decoration:none;color:#2457b8;background:#f2f6ff;border:1px solid #d9e4ff;border-radius:10px;padding:10px 12px;font-size:13px;font-weight:700;margin-top:12px}
.loading{text-align:center;padding:55px 15px;color:#687385;font-size:14px}.spinner{width:28px;height:28px;margin:0 auto 12px;border:3px solid #dce1e8;border-top-color:#172033;border-radius:50%;animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
.empty,.panel,.form-card{background:#fff;border:1px solid #d9dfe7;border-radius:16px;box-shadow:0 3px 10px rgba(20,30,45,.06)}
.empty{text-align:center;padding:35px 20px;color:#687385}
.screen{min-height:100vh}.register-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:#eef1f5}
.form-card{width:100%;max-width:430px;padding:24px 20px}.form-title{font-size:23px;font-weight:800;margin:0 0 8px}.form-text{font-size:13px;color:#697386;line-height:1.7;margin-bottom:18px}
.input,.textarea{width:100%;border:1px solid #cbd2dc;border-radius:10px;padding:11px 12px;outline:none;background:#fff}.input{height:48px}.textarea{min-height:120px;resize:vertical}.input:focus,.textarea:focus{border-color:#506b9b;box-shadow:0 0 0 3px rgba(80,107,155,.12)}
.primary-btn,.secondary-btn,.danger-btn{width:100%;min-height:48px;border:0;border-radius:10px;font-weight:800;margin-top:10px}.primary-btn{background:#172033;color:#fff}.secondary-btn{background:#eef1f5;color:#273246}.danger-btn{background:#dc3545;color:#fff}
.error{margin-top:11px;color:#d3293d;font-size:13px;line-height:1.6}
.admin-screen{display:none}.admin-header{background:#172033;color:#fff}.admin-header-inner{max-width:760px;margin:auto;min-height:62px;padding:9px 14px;display:flex;align-items:center;justify-content:space-between}.admin-title{font-size:18px;font-weight:800}
.admin-main{padding-top:16px}.panel{padding:15px;margin-bottom:13px}.panel-title{font-size:16px;font-weight:800;margin-bottom:12px}
.admin-list{display:flex;flex-direction:column;gap:9px}.admin-item{border:1px solid #dfe3e9;border-radius:11px;padding:12px;background:#fafbfc}.admin-item.urgent{background:#fff8df;border-color:#efc94d}
.admin-item-title{font-weight:800;font-size:15px}.admin-item-meta{font-size:11px;color:#687385;margin-top:4px}
.admin-actions{display:flex;gap:7px;margin-top:9px}.small-btn{flex:1;border:1px solid #ccd3dd;background:#fff;border-radius:8px;padding:8px;font-size:12px;font-weight:700}.small-btn.delete{color:#c62828}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.field label{display:block;font-size:12px;font-weight:700;margin-bottom:5px}.check{display:flex;align-items:center;gap:7px;font-size:13px;margin-top:12px}.check input{width:18px;height:18px}
.toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,20px);z-index:100;max-width:90%;background:#172033;color:#fff;border-radius:10px;padding:11px 16px;font-size:13px;box-shadow:0 6px 20px rgba(0,0,0,.2);opacity:0;pointer-events:none;transition:.2s}.toast.show{opacity:1;transform:translate(-50%,0)}
@media(max-width:480px){.header-inner{min-height:58px;padding:8px 12px}.logo{font-size:18px}.main,.admin-main{padding:14px 10px 30px}.page-title{font-size:22px}.notice-card{border-radius:14px;padding:13px}.notice-title{font-size:18px}.notice-body{font-size:14px}.form-grid{grid-template-columns:1fr}}

.file-preview{
  margin-top:14px;
  width:100%;
  overflow:hidden;
  border-radius:0;
  background:transparent;
}
.file-preview img{
  display:block;
  width:100%;
  height:auto;
  max-height:none;
  object-fit:contain;
  background:transparent;
}
.file-preview iframe{
  display:block;
  width:100%;
  height:75vh;
  min-height:420px;
  border:0;
  background:#fff;
}
.file-preview-label{
  display:none;
}
.file-error{
  padding:12px;
  border-radius:10px;
  background:#fff1f1;
  color:#b42318;
  font-size:13px;
}

.notice-details .file-preview{
  margin-left:0;
  margin-right:0;
  width:100%;
}

.pdf-download-box{
  display:flex;
  align-items:center;
  gap:10px;
  padding:12px;
  border:1px solid #dfe3e9;
  border-radius:10px;
  background:#f8fafc;
}
.pdf-download-icon{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  width:42px;
  height:42px;
  border-radius:8px;
  background:#172033;
  color:#fff;
  font-size:11px;
  font-weight:800;
}
.pdf-download-btn{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  min-height:40px;
  padding:0 14px;
  border-radius:9px;
  background:#172033;
  color:#fff;
  text-decoration:none;
  font-size:13px;
  font-weight:700;
}

.user-header{
  background:#172033;
  color:#fff;
  width:100%;
}
.user-header-inner{
  max-width:760px;
  min-height:62px;
  margin:0 auto;
  padding:9px 14px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  box-sizing:border-box;
}
.user-header .page-title{
  color:#fff;
  margin:0;
}
.user-header .admin-entry{
  color:#fff;
  border-color:rgba(255,255,255,.45);
  background:rgba(255,255,255,.08);
}
.attachment-badge{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  margin-left:5px;
  font-size:14px;
  line-height:1;
  vertical-align:middle;
}
.file-download-box{
  display:flex;
  align-items:center;
  gap:10px;
  padding:10px 0 0;
}
.file-download-icon{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  min-width:42px;
  height:38px;
  padding:0 7px;
  border-radius:8px;
  background:#172033;
  color:#fff;
  font-size:11px;

}
.file-download-btn{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  min-height:38px;
  padding:0 13px;
  border-radius:9px;
  background:#172033;
  color:#fff;
  text-decoration:none;
  font-size:13px;

}
@media(max-width:480px){
.user-header-inner{min-height:56px;padding:8px 12px}
.user-header .page-title{font-size:21px}
}</style>
</head>
<body>

<div id="userScreen">
<header class="user-header">
  <div class="user-header-inner">
    <h1 class="page-title">VFC Board</h1>
    <button class="admin-entry" onclick="showAdminLogin()">管理</button>
  </div>
</header>
<main class="main">
<div class="user-title-row" style="display:none">
  <h1 class="page-title">お知らせ</h1>
  <button class="admin-entry" onclick="showAdminLogin()">管理</button>
</div>
<div id="noticeList" class="notice-list"><div class="loading"><div class="spinner"></div>読み込み中…</div></div>
</main>
</div>

<div id="registerScreen" class="screen" style="display:none">
<div class="register-wrap"><div class="form-card">
<h1 class="form-title">初回登録</h1>
<div class="form-text">初回のみ登録コードを入力してください。<br>登録後は、この端末から自動的に利用できます。</div>
<input id="registerCode" class="input" type="text" autocomplete="off" placeholder="登録コード">
<button id="registerBtn" class="primary-btn" onclick="registerDevice()">この端末を登録</button>
<button class="secondary-btn" onclick="location.reload()">戻る</button>
<div id="registerError" class="error"></div>
</div></div>
</div>

<div id="adminLoginScreen" class="screen" style="display:none">
<div class="register-wrap"><div class="form-card">
<h1 class="form-title">管理者</h1>
<div class="form-text">管理者コードを入力してください。</div>
<input id="adminCode" class="input" type="password" autocomplete="off" placeholder="管理者コード">
<button id="adminLoginBtn" class="primary-btn" onclick="loginAdmin()">管理画面へ</button>
<button class="secondary-btn" onclick="showUserScreen()">戻る</button>
<div id="adminError" class="error"></div>
</div></div>
</div>

<div id="adminScreen" class="admin-screen">
<header class="admin-header"><div class="admin-header-inner">
<div class="admin-title">管理画面</div>
<button class="back-btn" onclick="showUserScreen()">利用画面へ戻る</button>
</div></header>
<main class="admin-main">
<div class="panel">
<div class="panel-title">お知らせ登録・編集</div>
<div class="form-grid">
<div class="field"><label>掲載日</label><input id="fDate" class="input" type="date"></div>
<div class="field">
  <label>期日</label>
  <div style="display:flex;gap:8px;align-items:center">
    <input id="fDue" class="input" type="date" style="flex:1">
    <label class="check" style="margin:0;white-space:nowrap">
      <input id="fNoDue" type="checkbox" onchange="toggleNoDue()"> 無期限
    </label>
  </div>
</div>
</div>
<div class="field" style="margin-top:9px"><label>タイトル</label><input id="fTitle" class="input" type="text" maxlength="100" placeholder="例：訓練のお知らせ"></div>
<div class="field" style="margin-top:9px"><label>本文</label><textarea id="fBody" class="textarea" placeholder="お知らせ内容"></textarea></div>
<label class="check"><input id="fImportant" type="checkbox"> 重要なお知らせ</label>
<div class="field" style="margin-top:12px"><label>添付ファイル（任意）</label><input id="fFile" class="input" type="file" accept="image/*,.pdf,application/pdf"></div>
<button class="primary-btn" onclick="saveNotice()">保存する</button>
<button class="secondary-btn" onclick="clearForm()">新規入力に戻す</button>
<div id="saveError" class="error"></div>
</div>

<div class="panel">
<div class="panel-title">登録済みお知らせ</div>
<div id="adminNoticeList" class="admin-list"><div class="loading"><div class="spinner"></div>読み込み中…</div></div>
</div>
</main>
</div>

<div id="toast" class="toast"></div>

<script>
/* ★ここにGASウェブアプリURLを入れてください */
const GAS_URL = "https://script.google.com/macros/s/AKfycbxoNoQf0sHjs3uhq56gYuxWmDvmdiheV3WI8j5BquSWUuNJI6U10Sql6oq2mvnkhcWLVA/exec";

const DEVICE_KEY="消防団お知らせ_token";
let adminPassword="";
let editingIndex=-1;
let adminNotices=[];

function getToken(){return localStorage.getItem(DEVICE_KEY)||""}

function showOnly(id){
  ["userScreen","registerScreen","adminLoginScreen","adminScreen"].forEach(x=>{
    document.getElementById(x).style.display="none";
  });
  document.getElementById(id).style.display=id==="adminScreen"?"block":"block";
}
function showUserScreen(){showOnly("userScreen");loadUserNotices()}
function showRegisterScreen(){showOnly("registerScreen")}
function showAdminLogin(){showOnly("adminLoginScreen");document.getElementById("adminCode").value=""}
function showAdminScreen(){showOnly("adminScreen");loadAdminNotices()}

async function requestGet(params){
  const url=new URL(GAS_URL);
  Object.entries(params).forEach(([k,v])=>url.searchParams.set(k,v));
  url.searchParams.set("_",Date.now().toString());
  const r=await fetch(url.toString(),{cache:"no-store"});
  if(!r.ok) throw new Error("HTTP "+r.status);
  return await r.json();
}
async function requestPost(data){
  const r=await fetch(GAS_URL,{
    method:"POST",
    headers:{"Content-Type":"text/plain;charset=utf-8"},
    body:JSON.stringify(data)
  });
  if(!r.ok)throw new Error("HTTP "+r.status);
  return r.json();
}

async function registerDevice(){
  const code=document.getElementById("registerCode").value.trim();
  const err=document.getElementById("registerError");
  err.textContent="";
  if(!code){err.textContent="登録コードを入力してください。";return}
  const btn=document.getElementById("registerBtn");btn.disabled=true;btn.textContent="登録中…";
  try{
    const res=await requestPost({action:"register",code});
    if(!res.ok)throw new Error(res.message||"登録に失敗しました。");
    localStorage.setItem(DEVICE_KEY,res.token);
    showToast("端末を登録しました");
    showUserScreen();
  }catch(e){err.textContent=e.message||"通信に失敗しました。"}
  finally{btn.disabled=false;btn.textContent="この端末を登録"}
}

async function loadUserNotices(){
  const list=document.getElementById("noticeList");
  const token=getToken();
  if(!token){showRegisterScreen();return}
  list.innerHTML='<div class="loading"><div class="spinner"></div>読み込み中…</div>';
  try{
    const res=await requestGet({action:"list",token});
    if(!res.ok){
      if((res.message||"").includes("登録されていません")){localStorage.removeItem(DEVICE_KEY);showRegisterScreen();return}
      throw new Error(res.message||"取得失敗");
    }
    renderUserNotices(res.notices||[]);
  }catch(e){
    list.innerHTML='<div class="empty">お知らせを取得できませんでした。<br><button class="secondary-btn" style="max-width:180px" onclick="loadUserNotices()">再読み込み</button></div>';
  }
}

function renderUserNotices(arr){
  const list=document.getElementById("noticeList");
  if(!arr.length){
    list.innerHTML='<div class="empty">現在、お知らせはありません。</div>';
    return;
  }
  const sorted=[...arr].sort((a,b)=>{
    const au=!!a.soon,bu=!!b.soon;
    if(au&&!bu)return -1;if(!au&&bu)return 1;
    if(au&&bu){const ad=a.due||"9999-12-31",bd=b.due||"9999-12-31";if(ad!==bd)return ad<bd?-1:1;}
    const ad=a.date||"0000-00-00",bd=b.date||"0000-00-00";
    if(ad!==bd)return ad>bd?-1:1;
    return 0;
  });
  list.innerHTML=sorted.map((n,i)=>{
    const urgent=!!n.soon,expired=n.due&&daysUntil(n.due)<0;
    let badges="";
    if(n.important)badges+='<span class="badge badge-important">重要</span>';
    if(n.fileId)badges+='<span class="attachment-badge" title="添付ファイルあり" aria-label="添付ファイルあり">📎</span>';
    if(urgent)badges+=`<span class="badge badge-urgent">${daysUntil(n.due)===0?"本日期限":"あと"+daysUntil(n.due)+"日"}</span>`;
    if(expired)badges+='<span class="badge badge-expired">期限終了</span>';
    const preview=n.fileId?`<div id="file-preview-${i}" class="file-preview" data-file-id="${esc(n.fileId)}" data-file-name="${esc(n.fileName||"添付ファイル")}" data-mime="${esc(n.mimeType||"")}" style="display:none"></div>`:"";
    const period=(n.date||n.due)?`<div class="notice-period">${n.date?"掲載日："+esc(n.date):""}${n.date&&n.due?"　":""}${n.due?"期日："+esc(n.due):"期日：無期限"}</div>`:"";
    return `<article class="notice-card ${urgent?"urgent ":""}${expired?"expired":""}">
      <button type="button" class="notice-summary-btn" onclick="toggleNoticeById('notice-detail-${i}',this,${n.fileId?`'file-preview-${i}'`:"null"})">
        <span class="notice-summary"><span class="notice-summary-main">
          <span class="notice-top" style="margin-bottom:4px"><span class="notice-date">${esc(n.date||"")}</span><span class="notice-status">${badges}</span></span>
          <span class="notice-title" style="display:block;margin-bottom:0">${esc(n.title)}</span>
        </span><span class="notice-chevron" aria-hidden="true">⌄</span></span>
      </button>
      <div id="notice-detail-${i}" class="notice-details">
        ${n.body?`<div class="notice-body">${esc(n.body)}</div>`:""}${preview}${period}
      </div>
    </article>`;
  }).join("");
}
function toggleNoticeById(id,btn,previewId){
  const detail=document.getElementById(id);
  if(!detail)return;
  const card=btn.closest(".notice-card");
  const isOpen=card.classList.toggle("open");
  detail.style.display=isOpen?"block":"none";
  btn.setAttribute("aria-expanded",isOpen?"true":"false");
  if(isOpen && previewId){
    const preview=document.getElementById(previewId);
    if(preview) loadInlineFile(preview);
  }
}

async function openPrivateFile(e,id,name){
  e.preventDefault();
  e.stopPropagation();
  try{
    showToast("ファイルを開いています…");
    const res=await requestGet({action:"file",id,token:getToken()});
    if(!res.ok)throw new Error(res.message||"ファイル取得失敗");
    const bytes=Uint8Array.from(atob(res.data),c=>c.charCodeAt(0));
    const blob=new Blob([bytes],{type:res.mimeType||"application/octet-stream"});
    const url=URL.createObjectURL(blob);
    const a=document.createElement("a");a.href=url;a.download=res.fileName||name;a.target="_blank";a.click();
    setTimeout(()=>URL.revokeObjectURL(url),60000);
  }catch(e){showToast("ファイルを開けませんでした")}
}

async function loadInlineFile(preview){
  if(preview.dataset.loading==="1" || preview.dataset.loaded==="1") return;

  preview.dataset.loading="1";
  preview.style.display="block";
  preview.innerHTML='<div class="file-download-loading">添付ファイルを準備中…</div>';

  try{
    const res=await requestGet({
      action:"file",
      id:preview.dataset.fileId,
      token:getToken()
    });

    if(!res || !res.ok || !res.data){
      throw new Error((res&&res.message)||"ファイル取得失敗");
    }

    const mime=(res.mimeType||"application/octet-stream").toLowerCase();
    const name=res.fileName||preview.dataset.fileName||"添付ファイル";
    const bytes=Uint8Array.from(atob(res.data),c=>c.charCodeAt(0));
    const blob=new Blob([bytes],{type:mime});
    const url=URL.createObjectURL(blob);

    const wrap=document.createElement("div");
    wrap.className="file-download-box";

    const icon=document.createElement("span");
    icon.className="file-download-icon";
    icon.textContent=mime==="application/pdf"||/\.pdf$/i.test(name)?"PDF":"画像";

    const a=document.createElement("a");
    a.href=url;
    a.download=name;
    a.className="file-download-btn";
    a.textContent="添付ファイルをダウンロード";
    a.addEventListener("click",()=>{
      setTimeout(()=>URL.revokeObjectURL(url),60000);
    });

    wrap.appendChild(icon);
    wrap.appendChild(a);
    preview.appendChild(wrap);

    preview.dataset.loaded="1";

  }catch(e){
    console.error("添付ファイル取得エラー:",e);
    preview.innerHTML='<div class="file-error">添付ファイルを取得できませんでした。</div>';
  }finally{
    delete preview.dataset.loading;
  }
}

async function loginAdmin(){
  const pw=document.getElementById("adminCode").value.trim();
  const err=document.getElementById("adminError");err.textContent="";
  if(!pw){err.textContent="管理者コードを入力してください。";return}
  const btn=document.getElementById("adminLoginBtn");btn.disabled=true;btn.textContent="確認中…";
  try{
    const res=await requestGet({action:"login",password:pw});
    if(!res.ok)throw new Error("管理者コードが違います。");
    adminPassword=pw;showAdminScreen();
  }catch(e){err.textContent=e.message||"通信に失敗しました。"}
  finally{btn.disabled=false;btn.textContent="管理画面へ"}
}

async function loadAdminNotices(){
  const list=document.getElementById("adminNoticeList");
  list.innerHTML='<div class="loading"><div class="spinner"></div>読み込み中…</div>';
  try{
    const res=await requestGet({action:"listAdmin",password:adminPassword});
    if(!res.ok)throw new Error(res.message||"取得失敗");
    adminNotices=res.notices||[];
    renderAdminNotices();
  }catch(e){list.innerHTML='<div class="empty">読み込みに失敗しました。</div>'}
}

function renderAdminNotices(){
  const list=document.getElementById("adminNoticeList");
  if(!adminNotices.length){list.innerHTML='<div class="empty">登録されたお知らせはありません。</div>';return}
  list.innerHTML=adminNotices.map((n,i)=>`
    <div class="admin-item ${n.soon?"urgent":""}">
      <div class="admin-item-title">${esc(n.title)}</div>
      <div class="admin-item-meta">掲載 ${esc(n.date||"-")}　期日 ${n.due?esc(n.due):"無期限"}${n.important?"　重要":""}</div>
      <div class="admin-actions">
        <button class="small-btn" onclick="editNotice(${i})">編集</button>
        <button class="small-btn delete" onclick="deleteNotice(${i})">削除</button>
      </div>
    </div>`).join("");
}

function editNotice(i){
  const n=adminNotices[i];editingIndex=(n.row||0)-2;
  document.getElementById("fDate").value=n.date||"";
  document.getElementById("fDue").value=n.due||"";
  document.getElementById("fNoDue").checked=!n.due;
  toggleNoDue();
  document.getElementById("fTitle").value=n.title||"";
  document.getElementById("fBody").value=n.body||"";
  document.getElementById("fImportant").checked=!!n.important;
  document.getElementById("saveError").textContent="";
  window.scrollTo({top:0,behavior:"smooth"});
}

function toggleNoDue(){
  const noDue=document.getElementById("fNoDue").checked;
  const due=document.getElementById("fDue");
  due.disabled=noDue;
  if(noDue) due.value="";
}

function clearForm(){
  editingIndex=-1;
  document.getElementById("fDate").value=localDate();
  document.getElementById("fNoDue").checked=true;
  toggleNoDue();
  document.getElementById("fDue").value="";
  document.getElementById("fNoDue").checked=true;
  toggleNoDue();
  document.getElementById("fTitle").value="";
  document.getElementById("fBody").value="";
  document.getElementById("fImportant").checked=false;
  document.getElementById("fFile").value="";
  document.getElementById("saveError").textContent="";
}

async function saveNotice(){
  const err=document.getElementById("saveError");err.textContent="";
  const title=document.getElementById("fTitle").value.trim();
  if(!title){err.textContent="タイトルを入力してください。";return}

  const noDue=document.getElementById("fNoDue").checked;
  const data={
    action:"save",
    password:adminPassword,
    index:editingIndex<0?"":editingIndex,
    date:document.getElementById("fDate").value,
    due:noDue?"":document.getElementById("fDue").value,
    title,
    body:document.getElementById("fBody").value,
    important:document.getElementById("fImportant").checked
  };

  const file=document.getElementById("fFile").files[0];

  try{
    showToast("保存準備中…");

    if(file){
      if(file.size>15*1024*1024){
        err.textContent="添付ファイルは15MB以下にしてください。";
        showToast("保存できません");
        return;
      }
      if(!(file.type||"").startsWith("image/") &&
         !file.name.toLowerCase().endsWith(".pdf")){
        err.textContent="添付できるのは画像またはPDFです。";
        showToast("保存できません");
        return;
      }
      showToast("画像・PDFを準備中…");
      data.file={
        name:file.name,
        mimeType:file.type||"application/octet-stream",
        data:await fileToBase64(file)
      };
    }

    showToast("保存しています…");
    const res=await requestPost(data);
    if(!res.ok)throw new Error(res.message||"保存失敗");

    showToast(editingIndex<0?"保存しました":"更新しました");
    clearForm();
    await loadAdminNotices();

  }catch(e){
    console.error(e);
    err.textContent=e.message||"保存に失敗しました。";
    showToast("保存に失敗しました");
  }
}

async function deleteNotice(i){
  const n=adminNotices[i];
  if(!confirm(`「${n.title}」を削除しますか？`))return;
  try{
    showToast("削除しています…");
    const res=await requestPost({action:"delete",password:adminPassword,index:(n.row||0)-2});
    if(!res.ok)throw new Error(res.message||"削除失敗");
    showToast("削除しました");await loadAdminNotices();
  }catch(e){showToast(e.message||"削除に失敗しました。")}
}

function fileToBase64(file){
  return new Promise((resolve,reject)=>{
    const r=new FileReader();r.onload=()=>resolve(String(r.result).split(",")[1]);r.onerror=reject;r.readAsDataURL(file);
  });
}
function daysUntil(s){
  const d=new Date(s+"T00:00:00"),t=new Date();t.setHours(0,0,0,0);
  return Math.round((d-t)/86400000);
}
function localDate(){
  const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
}
function esc(v){
  return String(v??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#039;");
}
let toastTimer;
function showToast(msg){
  const t=document.getElementById("toast");t.textContent=msg;t.classList.add("show");
  clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove("show"),2200);
}

document.addEventListener("DOMContentLoaded",()=>{
  if(GAS_URL==="YOUR_GAS_WEB_APP_URL"){
    document.getElementById("noticeList").innerHTML='<div class="empty">index.htmlのGAS_URLに、GASウェブアプリURLを設定してください。</div>';
    return;
  }
  if(getToken())showUserScreen();else showRegisterScreen();
  document.getElementById("fDate").value=localDate();
  document.getElementById("fNoDue").checked=true;
  toggleNoDue();
});
</script>
</body>
