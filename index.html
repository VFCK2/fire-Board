<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#173b5c">
<title>Board</title>
<style>
*{box-sizing:border-box}
:root{
  --navy:#173b5c;
  --navy2:#0f2d47;
  --page:#e9f2f8;
  --card:#fff;
  --text:#1d2a34;
  --muted:#71808c;
  --line:#dbe4ea;
  --blue:#1976d2;
  --red:#e53935;
  --orange:#f59e0b;
  --green:#26a65b;
}
html{scroll-behavior:smooth}
body{
  margin:0;
  background:linear-gradient(180deg,#dfeef7 0,#edf5f9 240px,var(--page) 100%);
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif;
}
header{
  position:sticky;top:0;z-index:20;
  background:linear-gradient(135deg,var(--navy),#245a82);
  color:#fff;
  padding:13px 14px;
  box-shadow:0 3px 12px #173b5c33;
}
.header-inner{
  max-width:720px;margin:auto;
  display:flex;align-items:center;justify-content:space-between;gap:10px
}
header h1{font-size:20px;margin:0;font-weight:800;letter-spacing:.02em}
.admin-open{
  border:1px solid #ffffff88;background:#ffffff12;color:#fff;
  border-radius:9px;padding:7px 11px;font-size:12px;font-weight:700
}
main{max-width:720px;margin:auto;padding:14px 12px 30px}

/* notice cards */
.card{
  background:var(--card);
  border:1px solid #dce7ee;
  border-radius:15px;
  margin:11px 0;
  padding:15px;
  box-shadow:0 4px 14px #31556b18;
}
.notice{
  position:relative;overflow:hidden;
  cursor:pointer;
  transition:transform .12s,box-shadow .12s;
}
.notice:active{transform:scale(.995)}
.notice::before{
  content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:#42a5f5;
}
.notice.soon-3{background:#fff9ef;border-color:#ffdca3}
.notice.soon-3::before{background:#f6ad1b}
.notice.soon-2{background:#fff5df;border-color:#ffc766}
.notice.soon-2::before{background:#f59e0b}
.notice.soon-1{background:#fff0e9;border-color:#ffb59e}
.notice.soon-1::before{background:#f4511e}
.notice.soon-0{background:#ffebee;border-color:#ff9da5}
.notice.soon-0::before{background:#e53935}
.notice-top{
  display:flex;align-items:center;justify-content:space-between;gap:8px;
  margin-bottom:5px
}
.date{font-size:12px;color:#657784}
.badges{display:flex;flex-wrap:wrap;gap:5px}
.badge{
  display:inline-flex;align-items:center;
  border-radius:999px;padding:4px 9px;
  font-size:11px;font-weight:800;white-space:nowrap
}
.badge.soon{background:#ef5350;color:#fff}
.badge.important{background:#1976d2;color:#fff}
.badge.normal{background:#e8f1f7;color:#356078}
.title{
  font-size:19px;font-weight:800;line-height:1.35;
  padding-right:24px;margin:3px 0 6px
}
.due-line{font-size:12px;color:#6b7780;margin-top:3px}
.soon-3 .due-line,.soon-2 .due-line,.soon-1 .due-line,.soon-0 .due-line{
  color:#b44321;font-weight:700
}
.arrow{
  position:absolute;right:14px;top:50%;
  transform:translateY(-50%);
  font-size:25px;color:#2b638d;font-weight:300
}
.body{
  display:none;margin-top:13px;padding-top:13px;
  border-top:1px solid #dce5ea;line-height:1.75;
  white-space:pre-wrap
}
.notice.open .body{display:block}
.attach{display:grid;gap:8px;margin-top:12px}
.attach button{
  width:100%;text-align:left;border:1px solid #cddbe4;
  border-radius:10px;padding:10px 12px;background:#f7fafc;color:#1d5b84;
  font-size:14px;font-weight:650
}
.empty{
  text-align:center;color:#71808c;
  background:#fff;border:1px solid #dce7ee;
  border-radius:15px;padding:45px 15px;margin-top:12px;
  box-shadow:0 4px 14px #31556b12
}

/* admin */
#admin{display:none}
.admin-card{margin-top:14px}
.admin-head{
  display:flex;align-items:center;justify-content:space-between;gap:10px;
  margin-bottom:12px
}
.admin-head h2{margin:0;font-size:20px}
.secondary{
  border:1px solid #ccd9e1;background:#f6f9fb;color:#29495d;
  border-radius:9px;padding:9px 12px;font-size:13px;font-weight:700
}
.row{display:grid;gap:8px;margin:11px 0}
label{font-size:13px;font-weight:700;color:#465964}
input,textarea{
  width:100%;padding:11px 12px;border:1px solid #cbd8e0;
  border-radius:9px;font-size:16px;background:#fff;color:#222
}
input[type=checkbox]{width:auto;transform:scale(1.15);margin-right:7px}
.primary{
  width:100%;padding:12px;border:0;border-radius:10px;
  background:linear-gradient(135deg,#1f78c8,#175d9c);
  color:#fff;font-size:16px;font-weight:800
}
.green{background:linear-gradient(135deg,#2eaf61,#21894a)}
.admin-item{
  background:#fff;border:1px solid #dce5ea;border-radius:12px;
  padding:12px;margin:9px 0
}
.admin-item.soon{border-left:5px solid #ef5350}
.admin-item-title{font-weight:800;margin-bottom:3px}
.admin-actions{display:flex;gap:7px;margin-top:9px}
.admin-actions button{flex:1}
.fileinfo{font-size:12px;color:#667984;margin-top:5px}
.small{font-size:12px;color:#73818b;line-height:1.6}
hr{border:0;border-top:1px solid #e2e8ec;margin:17px 0}

/* overlays */
.overlay{
  position:fixed;inset:0;background:#09223599;z-index:100;
  display:flex;align-items:center;justify-content:center;padding:20px
}
.modal{
  background:#fff;border-radius:17px;padding:23px;
  width:min(420px,100%);box-shadow:0 15px 45px #0004
}
.modal h2{margin:0 0 8px;font-size:21px}
.modal p{margin:7px 0}
</style>
</head>
<body>
<header>
  <div class="header-inner">
    <h1>消防団 お知らせ</h1>
    <button class="admin-open" onclick="showAdmin()">管理</button>
  </div>
</header>

<main>
  <section id="noticeList"></section>

  <section id="admin" class="card admin-card">
    <div class="admin-head">
      <h2>管理者</h2>
      <button class="secondary" onclick="closeAdmin()">← お知らせ画面に戻る</button>
    </div>

    <div id="adminPanel">
      <h3>お知らせ登録・編集</h3>
      <input type="hidden" id="editIndex">
      <div class="row"><label>掲載日<input id="date" type="date"></label></div>
      <div class="row"><label>期日<input id="due" type="date"></label></div>
      <div class="row"><label>タイトル<input id="title"></label></div>
      <div class="row"><label>本文<textarea id="body" rows="6"></textarea></label></div>
      <div class="row">
        <label><input id="important" type="checkbox">重要</label>
      </div>
      <div class="row">
        <label>PDF / 画像
          <input id="file" type="file" accept=".pdf,image/*" multiple>
        </label>
        <div id="fileinfo" class="fileinfo"></div>
      </div>
      <div class="row">
        <button class="primary green" onclick="saveNotice()">保存</button>
        <button class="secondary" onclick="clearForm()">新規入力に戻す</button>
      </div>

      <hr>
      <h3>登録済みのお知らせ</h3>
      <div id="adminList"></div>
    </div>
  </section>
</main>

<div id="adminOverlay" class="overlay" style="display:none">
  <div class="modal">
    <h2>管理者</h2>
    <p class="small">管理者パスワードを入力してください。</p>
    <input id="adminpwOverlay" type="password" placeholder="管理者パスワード">
    <div style="height:12px"></div>
    <button class="primary" onclick="openAdmin()">管理画面を開く</button>
    <div style="height:8px"></div>
    <button class="secondary" style="width:100%" onclick="hideAdmin()">閉じる</button>
    <p id="adminmsg" class="small"></p>
  </div>
</div>

<div id="registerOverlay" class="overlay">
  <div class="modal">
    <h2>初回登録</h2>
    <p>この端末を消防団のお知らせに登録します。</p>
    <p class="small">初回のみ登録コードを入力してください。登録後はこの端末から自動的に利用できます。</p>
    <input id="regcode" type="password" placeholder="登録コード">
    <div style="height:12px"></div>
    <button class="primary" onclick="registerDevice()">この端末を登録</button>
    <p id="regmsg" class="small"></p>
  </div>
</div>

<script>
const GAS_URL = "ここにGASウェブアプリURLを入れる";
const TOKEN_KEY = "fire_notice_device_token";
let deviceToken = localStorage.getItem(TOKEN_KEY) || "";

function api(url, options){
  return fetch(url, options).then(r=>{
    if(!r.ok) throw new Error("通信エラー");
    return r.json();
  });
}

async function registerDevice(){
  const code=document.getElementById("regcode").value.trim();
  const msg=document.getElementById("regmsg");
  if(!code){msg.textContent="登録コードを入力してください。";return}
  msg.textContent="登録中...";
  try{
    const r=await api(GAS_URL,{
      method:"POST",
      headers:{"Content-Type":"text/plain;charset=utf-8"},
      body:JSON.stringify({action:"register",code})
    });
    if(!r.ok) throw new Error(r.message||"登録できませんでした");
    deviceToken=r.token;
    localStorage.setItem(TOKEN_KEY,deviceToken);
    document.getElementById("registerOverlay").style.display="none";
    loadNotices();
  }catch(e){msg.textContent=e.message||"登録に失敗しました。"}
}

async function loadNotices(){
  if(!deviceToken)return;
  try{
    const r=await api(GAS_URL+"?action=list&token="+encodeURIComponent(deviceToken));
    if(!r.ok){
      localStorage.removeItem(TOKEN_KEY);
      deviceToken="";
      document.getElementById("registerOverlay").style.display="flex";
      return;
    }
    renderNotices(r.notices||[]);
  }catch(e){
    document.getElementById("noticeList").innerHTML='<div class="empty">お知らせを取得できませんでした。</div>';
  }
}

function getDueClass(n){
  if(!n.soon || !n.due) return "";
  const d=new Date(n.due+"T00:00:00");
  const now=new Date();
  const today=new Date(now.getFullYear(),now.getMonth(),now.getDate());
  const diff=Math.round((d-today)/86400000);
  if(diff<0 || diff>3)return "";
  return "soon-"+diff;
}
function getDueText(n){
  if(!n.due)return "";
  const d=new Date(n.due+"T00:00:00");
  const now=new Date();
  const today=new Date(now.getFullYear(),now.getMonth(),now.getDate());
  const diff=Math.round((d-today)/86400000);
  if(diff>=0 && diff<=3) return diff===0 ? "本日が期日" : "あと"+diff+"日";
  return "期日："+n.due;
}

function renderNotices(list){
  const root=document.getElementById("noticeList");
  if(!list.length){
    root.innerHTML='<div class="empty">現在、お知らせはありません。</div>';
    return;
  }
  root.innerHTML=list.map(n=>{
    const dueClass=getDueClass(n);
    const isSoon=!!dueClass;
    const soonBadge=isSoon?'<span class="badge soon">期日間近</span>':'';
    const important=n.important?'<span class="badge important">重要</span>':'';
    const attachments=(n.files&&n.files.length)?n.files:(n.fileId?[{id:n.fileId,name:n.fileName||"添付ファイルを開く"}]:[]);
    const file=attachments.length?`<div class="attach">${attachments.map((f,j)=>`<button onclick="event.stopPropagation();openPrivateFile('${escapeAttr(f.id)}')">資料 ${j+1}：${escapeHtml(f.name||"添付ファイルを開く")}</button>`).join("")}</div>`:"";
    return `<article class="card notice ${dueClass}" onclick="this.classList.toggle('open')">
      <div class="notice-top">
        <div class="badges">${soonBadge}${important}</div>
        <div class="date">${escapeHtml(n.date||"")}</div>
      </div>
      <div class="title">${escapeHtml(n.title||"")}</div>
      ${n.due?`<div class="due-line">${escapeHtml(getDueText(n))}</div>`:""}
      <div class="arrow">›</div>
      <div class="body">${escapeHtml(n.body||"")}${file}</div>
    </article>`;
  }).join("");
}

async function openPrivateFile(id){
  try{
    const r=await api(GAS_URL+"?action=file&token="+encodeURIComponent(deviceToken)+"&id="+encodeURIComponent(id));
    if(!r.ok)throw new Error(r.message||"ファイルを取得できませんでした");
    const bin=atob(r.data);
    const bytes=new Uint8Array(bin.length);
    for(let i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);
    const blob=new Blob([bytes],{type:r.mimeType||"application/octet-stream"});
    const url=URL.createObjectURL(blob);
    window.open(url,"_blank");
  }catch(e){alert(e.message||"ファイルを開けませんでした")}
}

function showAdmin(){
  document.getElementById("adminOverlay").style.display="flex";
  document.getElementById("adminpwOverlay").value="";
  document.getElementById("adminmsg").textContent="";
  setTimeout(()=>document.getElementById("adminpwOverlay").focus(),50);
}
function hideAdmin(){document.getElementById("adminOverlay").style.display="none"}

async function openAdmin(){
  const pw=document.getElementById("adminpwOverlay").value.trim();
  const msg=document.getElementById("adminmsg");
  if(!pw){msg.textContent="パスワードを入力してください。";return}
  msg.textContent="確認中...";
  try{
    const r=await api(GAS_URL+"?action=login&password="+encodeURIComponent(pw));
    if(!r.ok)throw new Error("パスワードが違います");
    document.getElementById("adminpw").value=pw;
    document.getElementById("admin").style.display="block";
    hideAdmin();
    loadAdminList();
    document.getElementById("admin").scrollIntoView({behavior:"smooth"});
  }catch(e){msg.textContent=e.message||"認証に失敗しました。"}
}

function closeAdmin(){
  document.getElementById("admin").style.display="none";
  window.scrollTo({top:0,behavior:"smooth"});
}

async function loadAdminList(){
  const pw=document.getElementById("adminpw").value;
  const r=await api(GAS_URL+"?action=listAdmin&password="+encodeURIComponent(pw));
  if(!r.ok){alert(r.message||"取得できません");return}
  document.getElementById("adminList").innerHTML=(r.notices||[]).map((n,i)=>{
    const dueClass=getDueClass(n);
    return `<div class="admin-item ${dueClass}">
      <div class="admin-item-title">${escapeHtml(n.title||"")}</div>
      <div class="small">${escapeHtml(n.date||"")}${n.due?"　期日："+escapeHtml(n.due):""}</div>
      <div class="admin-actions">
        <button class="secondary" onclick='editNotice(${i},${JSON.stringify(n)})'>編集</button>
        <button class="secondary" onclick="deleteNotice(${i})">削除</button>
      </div>
    </div>`;
  }).join("");
}

function editNotice(i,n){
  document.getElementById("editIndex").value=i;
  document.getElementById("date").value=n.date||"";
  document.getElementById("due").value=n.due||"";
  document.getElementById("title").value=n.title||"";
  document.getElementById("body").value=n.body||"";
  document.getElementById("important").checked=!!n.important;
  const current=(n.files&&n.files.length)?n.files.map(f=>f.name).join("、"):(n.fileName||"");
  document.getElementById("fileinfo").textContent=current?"現在の添付: "+current+"（新しいファイルを選ぶと追加されます）":"PDF・画像を複数選択できます。";
  document.getElementById("admin").scrollIntoView({behavior:"smooth"});
}

function clearForm(){
  ["date","due","title","body","editIndex"].forEach(id=>document.getElementById(id).value="");
  document.getElementById("important").checked=false;
  document.getElementById("file").value="";
  document.getElementById("fileinfo").textContent="PDF・画像を複数選択できます。";
}

async function saveNotice(){
  const pw=document.getElementById("adminpw").value;
  const selectedFiles=Array.from(document.getElementById("file").files||[]);
  const files=[];
  for(const f of selectedFiles){
    const buf=await f.arrayBuffer();
    let binary="";
    const bytes=new Uint8Array(buf),chunk=0x8000;
    for(let i=0;i<bytes.length;i+=chunk)binary+=String.fromCharCode(...bytes.subarray(i,i+chunk));
    files.push({name:f.name,mimeType:f.type||"application/octet-stream",data:btoa(binary)});
  }
  const payload={
    action:"save",password:pw,
    index:document.getElementById("editIndex").value,
    date:document.getElementById("date").value,
    due:document.getElementById("due").value,
    title:document.getElementById("title").value,
    body:document.getElementById("body").value,
    important:document.getElementById("important").checked,
    files:files
  };
  try{
    const r=await api(GAS_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(payload)});
    if(!r.ok)throw new Error(r.message||"保存できませんでした");
    alert("保存しました");
    clearForm();loadAdminList();loadNotices();
  }catch(e){alert(e.message||"保存に失敗しました")}
}

async function deleteNotice(i){
  if(!confirm("このお知らせを削除しますか？"))return;
  const pw=document.getElementById("adminpw").value;
  try{
    const r=await api(GAS_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({action:"delete",password:pw,index:i})});
    if(!r.ok)throw new Error(r.message||"削除できませんでした");
    loadAdminList();loadNotices();
  }catch(e){alert(e.message||"削除に失敗しました")}
}

document.getElementById("file").addEventListener("change",function(){
  const chosen=Array.from(this.files||[]);
  document.getElementById("fileinfo").textContent=chosen.length?chosen.length+"件選択中："+chosen.map(f=>f.name).join("、"):"PDF・画像を複数選択できます。";
});
function escapeHtml(s){
  return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}
function escapeAttr(s){return escapeHtml(s).replace(/`/g,"&#96;")}

if(!GAS_URL.includes("ここに"))loadNotices();
</script>
</body>
</html>
